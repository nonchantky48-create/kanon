# Laut yang Lupa

## BAB 1 — Surat Tanpa Perangko

Surat itu tidak berperangko. Sekar membaliknya dua kali, seolah perangko bisa muncul kalau ia cukup keras kepala. Tulisan tangannya miring ke kanan, huruf g-nya melingkar seperti kail. Tulisan Bima. Tidak ada orang lain yang menulis seperti itu.

Mata cokelat gelapnya menatap surat itu lama. Di bawah, Laras sudah berteriak memanggilnya sarapan. "Kar! Rotinya keburu dingin!"

Tanjung Kelam masih bau garam dan solar, persis seperti sembilan tahun lalu.

## BAB 2 — Kota yang Menutup Pintu

"Abangmu itu kabur, Mbak," kata polisi di meja depan tanpa mengangkat kepala. Sekar menggigit tutup pulpennya sampai retak.

Di parkiran, Gilang menyusulnya. Seragamnya terlalu rapi untuk kota sekecil ini. Ia menyodorkan map cokelat. "Jangan bilang dari saya."

Laras menunggu di motor, mesinnya masih menyala.

## BAB 3 — Lampu yang Tidak Menyala

Mbah Sarmi menghitung anak tangga keras-keras, seperti doa. Dua ratus dua belas. Lampu di atas sudah mati sejak badai.

"Laut itu ingat, Nak," katanya. "Kapal yang dibiarkan tenggelam, laut ingat."

Di laci kamar penjaga, Sekar menemukan surat kedua, dan sebuah kalung jangkar perak.

## BAB 4 — Sri Kelam

Kapal Sri Kelem lebih besar dari yang Sekar bayangkan. Galang berdiri di buritan, merokok, pura-pura tidak melihatnya naik.

Rangga Wiratama muncul dari kabin dengan senyum yang terlalu lembut. Ia menatap mata hitam legam perempuan itu dan berkata pelan, "Kamu pasti adiknya Bima."

Hilux hitamnya terparkir di ujung dermaga.

## BAB 5 — 1998

Bima berumur tiga tahun ketika langit Tanjung Kelam robek. Dari jendela mercusuar, Mbah Sarmi menggendongnya, menunjuk lampu-lampu kapal yang padam satu per satu.

Di dermaga, seorang pemuda berdiri tanpa jas hujan. Rangga. Ia tidak berlari menolong siapa pun.

## BAB 6 — Air Pasang

Mereka menemukan Mbah Sarmi di kaki mercusuar, tepat saat air pasang. Gilang menutup tubuhnya dengan terpal biru.

"Kecelakaan," kata kapolsek. Sekar menghitung anak tangga sendirian sore itu. Dua ratus dua belas. Tidak ada yang licin.

## BAB 7 — Yang Dikubur Laut

Laras menuang kopi tanpa ditanya. "Bapakku juga hilang malam itu, Kar." Ia menyebut nama Mbah Sarmi dengan suara bergetar. "Cuma dia yang mau cerita."

Ia menyodorkan HP-nya. Story terakhir @bimapradipta: foto laut malam, tanpa keterangan. Diunggah dua jam setelah Bima dinyatakan hilang.

## BAB 8 — Jong Terakhir

Jong-jong kecil dilarung ke laut saat matahari turun. Sekar berdiri di tengah dermaga, kalung jangkar di genggamannya, menatap Rangga di seberang kerumunan.
